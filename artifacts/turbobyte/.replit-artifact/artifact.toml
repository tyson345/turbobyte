kind = "web"
previewPath = "/"
title = "TurboByte Tech Solutions"
version = "1.0.0"
id = "artifacts/turbobyte"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26270

[services.development]
run = "pnpm --filter @workspace/turbobyte run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/turbobyte", "run", "build" ]
serve = "static"
publicDir = "artifacts/turbobyte/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26270"
BASE_PATH = "/"
